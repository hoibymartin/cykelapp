<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inomhuscykling – steg 2 och 3</title>
<style>
  html, body { margin: 0; height: 100%; background: #14181c; color: #e8ecef; font: 15px system-ui, sans-serif; }
  #pano { position: fixed; inset: 0; }
  #panel { position: fixed; top: 12px; left: 12px; z-index: 5; width: 310px; max-height: calc(100% - 100px); overflow: auto; padding: 14px; background: rgba(20,24,28,.92); border-radius: 10px; display: grid; gap: 8px; }
  #panel input, #panel button { font: inherit; padding: 8px; border-radius: 6px; border: 1px solid #3a444d; background: #1d2329; color: inherit; }
  #panel input[type=range] { padding: 0; width: 100%; }
  #panel button { background: #2f7de1; border-color: #2f7de1; cursor: pointer; }
  #panel button.alt { background: #1d2329; border-color: #3a444d; }
  #panel button:focus-visible, #panel input:focus-visible { outline: 2px solid #9cc4ff; }
  hr { border: 0; border-top: 1px solid #2c353d; width: 100%; margin: 4px 0; }
  .st { font-size: 13px; opacity: .8; min-height: 1.2em; }
  #hud { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 5; display: flex; gap: 22px; padding: 10px 22px; background: rgba(20,24,28,.85); border-radius: 10px; font-size: 24px; font-variant-numeric: tabular-nums; text-align: center; }
  #hud small { display: block; font-size: 12px; opacity: .7; }
</style>
</head>
<body>
<div id="pano"></div>

<div id="panel">
  <input id="key" placeholder="Google Maps API-nyckel" autocomplete="off">
  <input id="from" value="Kista Galleria, Stockholm">
  <input id="to" value="Djurgården, Stockholm">
  <button id="go">Ladda rutt</button>
  <div class="st" id="status"></div>
  <hr>
  <button id="bt" class="alt">Anslut cykeltrainer (Bluetooth)</button>
  <div class="st" id="tstatus">Ingen trainer ansluten – använd simulatorn.</div>
  <label>Simulerad effekt: <b id="simL">150</b> W
    <input id="sim" type="range" min="0" max="500" value="150"></label>
  <label>Lutning (test): <b id="gradL">0</b> %
    <input id="grad" type="range" min="-10" max="15" step="0.5" value="0"></label>
  <label>Din vikt (kg): <input id="mass" type="number" value="75" min="30" max="200" style="width:80px"></label>
</div>

<div id="hud">
  <div><span id="hSpeed">0</span><small>km/h</small></div>
  <div><span id="hPow">0</span><small>watt</small></div>
  <div><span id="hCad">0</span><small>rpm</small></div>
  <div><span id="hDist">0.00</span><small>km</small></div>
  <div><span id="hLeft">0.0</span><small>km kvar</small></div>
</div>

<script>
const $ = id => document.getElementById(id);
const STEP_M = 8, BIKE_KG = 9, CRR = 0.004, CDA = 0.32, RHO = 1.226, G = 9.81, EFF = 0.975;

// --- Tillstånd ---
let pano, svc, points = [], dist = 0, lastIdx = -1, busy = false, last = 0, running = false;
let v = 0;                         // hastighet, m/s
let power = 150, powerSmooth = 0, cadence = 0, trainerOn = false;

try { $('key').value = localStorage.getItem('gmkey') || ''; } catch (e) {}
$('sim').oninput = e => { if (!trainerOn) power = +e.target.value; $('simL').textContent = e.target.value; };
$('grad').oninput = e => $('gradL').textContent = e.target.value;

// =====================================================
// STEG 2: Bluetooth-trainer (FTMS, med reserv för Cycling Power)
// =====================================================
const FTMS = 0x1826, INDOOR_BIKE = 0x2AD2, CPS = 0x1818, CPS_MEAS = 0x2A63;

$('bt').onclick = async () => {
  if (!navigator.bluetooth) return tstatus('Din webbläsare saknar Web Bluetooth. Använd Chrome eller Edge.');
  try {
    tstatus('Söker trainer...');
    const dev = await navigator.bluetooth.requestDevice({
      filters: [{ services: [FTMS] }, { services: [CPS] }],
      optionalServices: [FTMS, CPS]
    });
    dev.addEventListener('gattserverdisconnected', () => { trainerOn = false; tstatus('Trainer frånkopplad – simulatorn används.'); });
    const server = await dev.gatt.connect();
    let ch;
    try {
      ch = await (await server.getPrimaryService(FTMS)).getCharacteristic(INDOOR_BIKE);
      ch.addEventListener('characteristicvaluechanged', e => parseFTMS(e.target.value));
    } catch (e) {
      ch = await (await server.getPrimaryService(CPS)).getCharacteristic(CPS_MEAS);
      ch.addEventListener('characteristicvaluechanged', e => parseCPS(e.target.value));
    }
    await ch.startNotifications();
    trainerOn = true;
    tstatus('Ansluten: ' + (dev.name || 'trainer'));
  } catch (e) { tstatus('Kunde inte ansluta: ' + e.message); }
};

// Indoor Bike Data: fälten kommer i fast ordning, flaggorna visar vilka som finns
function parseFTMS(dv) {
  let o = 0; const f = dv.getUint16(o, true); o += 2;
  if (!(f & 1)) o += 2;                                   // momentan fart (vi räknar själva)
  if (f & 2) o += 2;                                      // snittfart
  if (f & 4) { cadence = dv.getUint16(o, true) / 2; o += 2; }
  if (f & 8) o += 2;                                      // snittkadens
  if (f & 16) o += 3;                                     // total distans
  if (f & 32) o += 2;                                     // motståndsnivå
  if (f & 64) { power = Math.max(0, dv.getInt16(o, true)); o += 2; }
}
// Cycling Power Measurement: bara effekt (kadens kräver mer parsning)
function parseCPS(dv) { power = Math.max(0, dv.getInt16(2, true)); }

// =====================================================
// STEG 3: Fysikmotor (watt -> hastighet)
// =====================================================
function physics(dt) {
  powerSmooth += (power - powerSmooth) * Math.min(1, dt / 1.5);   // jämna ut effekten
  const m = (+$('mass').value || 75) + BIKE_KG;
  const th = Math.atan(+$('grad').value / 100);
  const fRoll = CRR * m * G * Math.cos(th);
  const fGrav = m * G * Math.sin(th);
  const fAir = 0.5 * RHO * CDA * v * v;
  const fDrive = powerSmooth * EFF / Math.max(v, 1.5);            // F = P / v
  v = Math.min(25, Math.max(0, v + ((fDrive - fRoll - fGrav - fAir) / m) * dt));
}

// =====================================================
// Steg 1: Street View längs rutt (som tidigare)
// =====================================================
$('go').onclick = async () => {
  const key = $('key').value.trim();
  if (!key) return status('Ange din API-nyckel först.');
  try { localStorage.setItem('gmkey', key); } catch (e) {}
  status('Laddar Google Maps...');
  try { await loadMaps(key); await loadRoute(); } catch (e) { status('Fel: ' + e.message); }
};

function loadMaps(key) {
  if (window.google && google.maps && google.maps.geometry) return Promise.resolve();
  return new Promise((ok, fail) => {
    const s = document.createElement('script');
    s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&libraries=geometry&v=weekly`;
    s.onload = ok; s.onerror = () => fail(new Error('Kunde inte ladda Google Maps'));
    document.head.appendChild(s);
  });
}

function loadRoute() {
  return new Promise((ok, fail) => {
    new google.maps.DirectionsService().route({
      origin: $('from').value, destination: $('to').value,
      travelMode: google.maps.TravelMode.BICYCLING
    }, (res, st) => {
      if (st !== 'OK') return fail(new Error('Ingen rutt hittades (' + st + ')'));
      points = densify(res.routes[0].overview_path);
      dist = 0; lastIdx = -1; v = 0;
      svc = new google.maps.StreetViewService();
      pano = new google.maps.StreetViewPanorama($('pano'), {
        position: points[0], pov: { heading: 0, pitch: 0 },
        disableDefaultUI: true, clickToGo: false, linksControl: false,
        scrollwheel: false, motionTracking: false
      });
      status('Rutt: ' + (points.length * STEP_M / 1000).toFixed(1) + ' km. Börja trampa!');
      last = performance.now();
      if (!running) { running = true; requestAnimationFrame(tick); }
      ok();
    });
  });
}

function densify(path) {
  const out = [path[0]], S = google.maps.geometry.spherical;
  for (let i = 1; i < path.length; i++) {
    const a = path[i - 1], b = path[i], d = S.computeDistanceBetween(a, b);
    for (let m = STEP_M; m < d; m += STEP_M) out.push(S.interpolate(a, b, m / d));
    out.push(b);
  }
  return out;
}

function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  physics(dt);
  dist += v * dt;
  const idx = Math.min(Math.floor(dist / STEP_M), points.length - 2);
  if (idx !== lastIdx && !busy) { lastIdx = idx; moveTo(idx); }
  $('hSpeed').textContent = (v * 3.6).toFixed(1);
  $('hPow').textContent = Math.round(powerSmooth);
  $('hCad').textContent = Math.round(cadence);
  $('hDist').textContent = (dist / 1000).toFixed(2);
  $('hLeft').textContent = Math.max(0, (points.length * STEP_M - dist) / 1000).toFixed(1);
  if (idx < points.length - 2) requestAnimationFrame(tick); else { running = false; status('Framme!'); }
}

function moveTo(i) {
  busy = true;
  const S = google.maps.geometry.spherical;
  const heading = S.computeHeading(points[i], points[Math.min(i + 3, points.length - 1)]);
  svc.getPanorama({ location: points[i], radius: 25, source: google.maps.StreetViewSource.OUTDOOR }, (data, st) => {
    if (st === 'OK') { pano.setPano(data.location.pano); pano.setPov({ heading, pitch: 0 }); }
    busy = false;
  });
}

function status(t) { $('status').textContent = t; }
function tstatus(t) { $('tstatus').textContent = t; }
</script>
</body>
</html>
